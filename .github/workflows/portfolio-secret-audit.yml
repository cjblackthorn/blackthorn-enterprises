name: Audit tracked secrets across public website repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '40 16 * * 1'
  push:
    branches:
      - security/portfolio-secret-audit-20261024
      - main
    paths:
      - '.github/workflows/portfolio-secret-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-secret-audit.yml'

permissions:
  contents: read

jobs:
  full-history-gitleaks:
    name: Secret scan (${{ matrix.repo }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repo:
          - blackthorn-enterprises
          - blackthorn-rootworks
          - blackthorn-tropicals
          - corrine-j-blackthorn
          - cjblackthorn.github.io
          - technerd
          - glass-and-thorns
          - glass-rose-collective
          - petals-and-frames
          - thorns2roses
    steps:
      - name: Checkout public repository and full commit history
        uses: actions/checkout@v7
        with:
          repository: cjblackthorn/${{ matrix.repo }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete Git history is available
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse --is-shallow-repository)" = false
          test "$(git -C target rev-parse --verify HEAD)" != ""
      - name: Scan full Git history using version-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secret-scan"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target:/repo:ro" \
            -v "$RUNNER_TEMP/secret-scan:/scanout" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact=100 --log-level error \
            --report-format json --report-path /scanout/findings.json \
            >"$RUNNER_TEMP/secret-scan/private-scan.log" 2>&1
          code=$?
          set -e
          # Never print the scanner's raw output, file names, matches or
          # JSON to public GitHub Actions logs, comments or artifacts.
          SCAN_CODE="$code" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          code=int(os.environ["SCAN_CODE"])
          report=Path(os.environ["RUNNER_TEMP"])/"secret-scan"/"findings.json"
          if code not in (0,1):
              print("::error title=Secret scanner unavailable::The Gitleaks tool failed; no clean scan can be claimed.")
              sys.exit(2)
          if report.exists():
              try:
                  findings=json.loads(report.read_text(encoding="utf-8"))
                  if findings is None:
                      findings=[]
                  if not isinstance(findings,list):
                      raise ValueError("Unexpected scanner report format")
              except Exception:
                  print("::error title=Secret scan report invalid::Unable to verify scan results.")
                  sys.exit(2)
          else:
              if code==1:
                  print("::error title=Secret scan incomplete::Findings reported but no parseable report available.")
                  sys.exit(2)
              findings=[]
          if code==1 or findings:
              print("::error title=Potential historical credential exposure::Review Gitleaks findings privately; rotate or revoke any real credentials. No secret values have been printed or uploaded.")
              sys.exit(1)
          print("PASS: Full Git history scanned with Gitleaks v8.30.1. No matching findings under the current rules.")
          PY
