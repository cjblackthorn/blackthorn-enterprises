name: Browser QA smoke (read only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/browser_smoke.cjs'
      - '.github/workflows/browser-qa.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Check browser smoke script syntax
        run: node --check scripts/browser_smoke.cjs
      - name: Browser smoke test without submitting forms or bypassing TLS
        run: node scripts/browser_smoke.cjs
      - name: Preserve mobile screenshots and diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-results
          path: browser-artifacts/
          retention-days: 14
          if-no-files-found: warn
